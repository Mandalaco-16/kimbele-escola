{% extends "admin/base.html" %}
{% block extrahead %}{{ block.super }}
<style>
#voltar-admin{display:inline-block;margin:8px 15px 0;padding:5px 12px;background:#417690;color:#fff !important;border-radius:4px;font-size:13px;text-decoration:none}
</style>
{% endblock %}
{% block content_title %}{{ block.super }}{% endblock %}
{% block breadcrumbs %}
<a id="voltar-admin" href="/painel/sms/">&larr; Voltar</a>
{{ block.super }}
<script>
(function(){
 var a=document.getElementById('voltar-admin');
 if(location.pathname.replace(/\/+$/,'')!=='/django-admin' && history.length>1){
  a.href='#';
  a.onclick=function(e){e.preventDefault();history.back();};
 }
})();
</script>
{% endblock %}
