{% extends "admin/base.html" %}
{% block extrahead %}{{ block.super }}
<style>
#voltar-admin{display:inline-block;margin:8px 15px 4px;padding:6px 14px;background:#417690;color:#fff !important;border-radius:4px;font-size:14px;text-decoration:none}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
 var c=document.getElementById('container');
 if(!c||document.getElementById('voltar-admin'))return;
 var a=document.createElement('a');
 a.id='voltar-admin';a.innerHTML='&larr; Voltar';
 var raiz=location.pathname.replace(/\/+$/,'')==='/django-admin';
 a.href=raiz?'/painel/sms/':'#';
 if(!raiz){a.onclick=function(e){e.preventDefault();if(history.length>1){history.back();}else{location.href='/django-admin/';}};}
 c.insertBefore(a,c.firstChild);
});
</script>
{% endblock %}
