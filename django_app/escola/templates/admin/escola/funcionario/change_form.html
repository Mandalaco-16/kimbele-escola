{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}

    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="margin-bottom: 1rem;">Contactar {{ original.nome }}</h2>
      <p>
        <a href="{% url 'escola:funcionario_enviar_mensagem_direcao' original.pk %}" class="button" target="_blank">
          📩 Enviar SMS, foto ou documento

      </p>

{% endblock %}
