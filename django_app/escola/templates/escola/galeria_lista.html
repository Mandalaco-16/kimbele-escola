{% extends "escola/base.html" %}
{% block titulo %}{{ titulo_pagina }} - {{ NOME_ESCOLA }}{% endblock %}
{% block conteudo %}
<section class="secao">
  <h2>{{ titulo_pagina }}</h2>
  <div class="galeria-grade">
    {% for img in imagens %}
      <img src="{{ img.imagem.url }}" alt="{{ img.titulo }}" class="galeria-grade__imagem">
    {% empty %}
      <p>{{ vazio_texto }}</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
