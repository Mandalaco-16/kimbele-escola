{% extends "escola/base.html" %}
{% block titulo %}Desenvolvidor do site - {{ NOME_ESCOLA }}{% endblock %}
{% block conteudo %}
<section class="secao secao--estreita">
  {% if dev %}
    <h3>{{ dev.nome }}</h3>
    <p style="white-space: pre-line;">{{ dev.informacoes }}</p>
  {% else %}
    <p>Informações do desenvolvedor ainda não foram adicionadas.</p>
  {% endif %}
</section>
{% endblock %}
